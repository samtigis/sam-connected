name: sam_connected_client
description: "Unified Dual-Mode Local Auto-Backup & Storage Host Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Persistent Preferences & Role Management
  shared_preferences: ^2.2.2

  # Gallery & Local Asset Management
  photo_manager: ^3.0.0

  # Local SQLite Persistence (Mobile & Desktop FFI)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0

  # mDNS Service Discovery (_photobackup._tcp)
  nsd: ^4.0.4

  # Network Client & Multipart Uploads
  dio: ^5.4.0

  # Background Automation (Android WorkManager)
  workmanager: ^0.5.2

  # Filesystem, Crypto, and Utilities
  path_provider: ^2.1.2
  path: ^1.9.0
  crypto: ^3.0.3
  file_picker: ^8.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bin/
